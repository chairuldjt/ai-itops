services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_gateway
    # Bind to loopback only — the app reaches postgres via the compose
    # network; never expose the DB on all host interfaces.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Resolve host.docker.internal on Linux too (default UPSTREAM_BASE_URL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_gateway
      # Required — the app refuses to boot in production without a strong,
      # unique secret (never ship the placeholder).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?"Set BETTER_AUTH_SECRET to a long random value (>=32 chars)"}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:9003}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:9003}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://host.docker.internal:8080/v1}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-AI Gateway <onboarding@resend.dev>}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      # Required — production seeding refuses weak/known passwords, so the
      # compose default must not be a placeholder that guarantees boot failure.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?"Set SEED_ADMIN_PASSWORD to a strong unique value (>=12 chars)"}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
    ports:
      - "9003:9003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9003/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  pgdata:
